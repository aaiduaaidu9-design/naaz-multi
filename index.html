<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAAZ MULTI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#03102b">
<style>
:root{--pink:#38bdf8;--gold:#93c5fd;--card:#ffffff12;--line:#7dd3fc40}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;font-family:system-ui,sans-serif;color:#eaf6ff;background:linear-gradient(160deg,#03102b,#0a2a66 60%,#041a3f) fixed;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(logo.png) center 45%/70% no-repeat;opacity:.1}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#03102bcc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
main{position:relative;z-index:2}footer{position:relative;z-index:0}
h1{margin:0;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:20px;letter-spacing:2px}
h1::before{content:"";display:inline-block;width:30px;height:30px;margin-right:8px;vertical-align:middle;background:url(logo.png) center/contain no-repeat}
main{padding:12px;max-width:900px;margin:auto}
button{border:0;border-radius:10px;padding:8px 12px;background:linear-gradient(90deg,#0ea5e9,#2563eb);color:#fff;font-size:14px;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}header button,button.gray,.x{background:#ffffff22}
button.wa{background:linear-gradient(90deg,#25d366,#0fa958);width:100%;padding:12px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{background:transparent;border:1px solid var(--pink);color:#bae6fd;white-space:nowrap}
.chip.on{background:linear-gradient(90deg,#38bdf8,#93c5fd);color:#03102b;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;perspective:900px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{position:relative;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px #0006;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s}
.card::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,#ffffff22,transparent);transform:skewX(-20deg);animation:shine 4s infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-120%}100%{left:160%}}
.anim .card{animation:rise .6s both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(30px) rotateX(-35deg)}to{opacity:1}}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#ffffff10;display:flex;align-items:center;justify-content:center;font-size:40px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.card span{color:#7dd3fc;font-weight:700}.card em{color:#93b4d9;font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.box h2,.box h3{margin:0;display:flex;justify-content:space-between;align-items:center}
input,select{padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;width:100%;background:#00000040;color:#fff}
select option{color:#000}input[type=checkbox]{width:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.err{color:#ff7b7b;margin:0}.sheet{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:flex-end}
.sheet .box{width:100%;max-height:80vh;overflow:auto;margin:0;border-radius:20px 20px 0 0;background:#06204d}
footer{text-align:center;padding:16px;font-size:12px}footer a{color:#93b4d9}
.pv{position:fixed;inset:0;z-index:20;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.pvbox{position:relative;width:100%;max-width:380px;background:#06204d;border:1px solid var(--line);border-radius:22px;padding:16px;text-align:center;animation:zoom .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes zoom{from{transform:scale(.6) rotateX(30deg);opacity:0}}
.pvx{position:absolute;top:10px;right:10px}
.pvimg{perspective:700px;margin:8px 0;display:flex;justify-content:center}
.pvimg img,.pvimg .ph{width:80%;aspect-ratio:1;object-fit:cover;border-radius:16px;animation:swing 6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotateY(-18deg)}50%{transform:rotateY(18deg)}}
.pvp{font-size:24px;font-weight:700;color:#7dd3fc;margin:4px 0 12px;animation:pop .5s .2s both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.pvadd{width:100%;padding:12px;font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.hl{display:flex;align-items:center;gap:10px}
#menuBtn{background:#ffffff22;font-size:20px;padding:6px 12px;line-height:1}
#ov{position:fixed;inset:0;z-index:30;background:#000a;opacity:0;pointer-events:none;transition:opacity .3s}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;z-index:31;background:linear-gradient(180deg,#06204d,#03102b);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:16px;gap:4px;overflow:auto}
body.menu #drawer{transform:none}body.menu #ov{opacity:1;pointer-events:auto}
#drawer .dh{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700;letter-spacing:2px;color:#7dd3fc}
#drawer .dh img{width:34px}
#drawer .dl{margin:12px 4px 4px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#7fa6d6}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border:0;border-radius:10px;background:transparent;color:#eaf6ff;font-size:15px;text-align:left;text-decoration:none;cursor:pointer}
.mi small{margin-left:auto;opacity:.6}
.mi.on{background:linear-gradient(90deg,#38bdf855,#2563eb33)}
body.menu .mi{animation:mi .4s both;animation-delay:calc(var(--k)*45ms)}
@keyframes mi{from{opacity:0;transform:translateX(-24px)}}
.ptitle{margin:6px 2px 10px;font-size:18px;color:#bae6fd}.ptitle small{opacity:.6}
.upl{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px dashed var(--pink);border-radius:12px;color:#bae6fd;cursor:pointer}
.pvs{width:110px;height:110px;object-fit:cover;border-radius:12px}
.cd{color:#9fc3e8;font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pvd{margin:0 0 14px;color:#d6ecff;font-size:14px;line-height:1.5;text-align:left;white-space:pre-line;max-height:25vh;overflow:auto}
.pvbox{max-height:90vh;overflow:auto}
</style></head><body>
<header><div class="hl"><button id="menuBtn" aria-label="Menu" onclick="toggleMenu()">☰</button><h1>NAAZ MULTI</h1></div><button id="cartBtn" onclick="toggleCart()">🛒 <span id="cnt">0</span></button></header>
<div id="ov" onclick="toggleMenu(false)"></div><aside id="drawer"></aside>
<main id="app"></main>
<footer><a href="#admin">Admin</a> · <a href="#">Shop</a></footer>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const WHATSAPP="94767605858";
const CLOUD="",PRESET=""; // optional: Cloudinary cloud name + unsigned upload preset
const CATS=["Dress","Shoes","Toys","Plastic","Kitchenware","Daraz"];
const fb=initializeApp({
  apiKey:"AIzaSyD9qxeP6S4wawscbG7tXSFjJJ_JnBDqbRs",
  authDomain:"naaz-multi.firebaseapp.com",
  projectId:"naaz-multi",
  storageBucket:"naaz-multi.firebasestorage.app",
  messagingSenderId:"385976763931",
  appId:"1:385976763931:web:6cfdce44195c6831899abe"
});
const db=getFirestore(fb),auth=getAuth(fb);
let products=[],cat="All",cart={},user=null,editId=null,showCart=false,anim=true,pendingImg=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"Rs. "+Number(n||0).toLocaleString();

onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),s=>{products=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.error(e));
onAuthStateChanged(auth,u=>{user=u;render()});
addEventListener("hashchange",render);

const A=$("#app");
A.addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*16+"deg");c.style.setProperty("--rx",-((e.clientY-r.top)/r.height-.5)*16+"deg")});
A.addEventListener("pointerout",e=>{const c=e.target.closest(".card");if(c){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}});
// product page (tap a card)
A.addEventListener("click",e=>{
  if(e.target.closest("button"))return;
  const c=e.target.closest(".card");if(!c)return;
  const img=c.querySelector("img"),btn=c.querySelector("button");
  const o=document.createElement("div");o.className="pv";
  o.innerHTML='<div class="pvbox"><button class="x pvx">✕</button><div class="pvimg">'+(img?'<img alt="">':'<div class="ph">📦</div>')+'</div><h2 style="margin:0"></h2><p class="pvp"></p>'+(btn?'<button class="pvadd">Add to cart</button>':'<em>Out of stock</em>')+'</div>';
  if(img)o.querySelector("img").src=img.src;
  o.querySelector("h2").textContent=c.querySelector("b").textContent;
  o.querySelector(".pvp").textContent=c.querySelector("span").textContent;
  if(c.dataset.d){const d=document.createElement("p");d.className="pvd";d.textContent=c.dataset.d;o.querySelector(".pvp").after(d)}
  const close=()=>o.remove();
  o.addEventListener("click",ev=>{if(ev.target===o||ev.target.closest(".pvx"))close()});
  const add=o.querySelector(".pvadd");
  if(add)add.onclick=()=>{btn.click();close();$("#cartBtn").animate([{transform:"scale(1)"},{transform:"scale(1.35)"},{transform:"scale(1)"}],{duration:380})};
  document.body.appendChild(o);
});

const ICON={All:"🛍️",Dress:"👗",Shoes:"👟",Toys:"🧸",Plastic:"🧺",Kitchenware:"🍽️",Daraz:"📦"};
function buildMenu(){
  const n=c=>c==="All"?products.length:products.filter(p=>p.category===c).length;
  $("#drawer").innerHTML=`<div class="dh"><img src="logo.png" alt="">NAAZ MULTI</div><div class="dl">Categories</div>
  ${["All",...CATS].map((c,i)=>`<button class="mi ${c===cat&&location.hash!=="#admin"?"on":""}" style="--k:${i}" onclick="goCat('${c}')">${ICON[c]} ${c==="All"?"All Products":c} <small>${n(c)}</small></button>`).join("")}
  <div class="dl">Shop</div>
  <button class="mi" style="--k:8" onclick="goAbout()">ℹ️ About Us</button>
  <button class="mi" style="--k:9" onclick="goAbout()">📍 Location</button>
  <a class="mi" style="--k:10" href="https://instagram.com/naaz_multi_collection" target="_blank" rel="noopener">📷 Instagram</a>
  <a class="mi" style="--k:11" href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">💬 WhatsApp</a>`;
}
const thumb=u=>String(u).includes("res.cloudinary.com")?String(u).replace("/upload/","/upload/w_500,q_auto,f_auto/"):u;
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error("Compress failed")),"image/jpeg",q)};
  img.onerror=()=>rej(new Error("Not a valid image"));img.src=u})}
function cartItems(){return Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id===id),q})).filter(x=>x.p)}
function render(){
  $("#cnt").textContent=Object.values(cart).reduce((a,b)=>a+b,0);
  A.innerHTML=location.hash==="#admin"?adminView():storeView();
  buildMenu();
  if(products.length)anim=false;
}
function storeView(){
  const list=products.filter(p=>cat==="All"||p.category===cat);
  return `<h3 class="ptitle">${cat==="All"?"All Products":esc(cat)} <small>(${list.length})</small></h3>
  <div class="grid ${anim?"anim":""}">${list.map((p,i)=>`<div class="card" data-id="${p.id}" data-d="${esc(p.description)}" style="--i:${i}">${p.imageUrl?`<img src="${esc(thumb(p.imageUrl))}" loading="lazy" alt="">`:`<div class="ph">📦</div>`}<b>${esc(p.name)}</b>${p.description?`<small class="cd">${esc(p.description)}</small>`:""}<span>${money(p.price)}</span>${p.inStock===false?`<em>Out of stock</em>`:`<button onclick="add('${p.id}')">Add to cart</button>`}</div>`).join("")}</div>
  ${list.length?"":"<p>No products yet</p>"}${showCart?cartView():""}`;
}
function cartView(){
  const items=cartItems(),total=items.reduce((a,x)=>a+x.p.price*x.q,0);
  return `<div class="sheet"><div class="box"><h3>Your Cart <button class="x" onclick="toggleCart()">✕</button></h3>
  ${items.map(x=>`<div class="row"><span>${esc(x.p.name)}<br><small>${money(x.p.price)}</small></span><span><button onclick="qty('${x.p.id}',-1)">−</button> ${x.q} <button onclick="qty('${x.p.id}',1)">+</button></span></div>`).join("")||"<p>Cart is empty</p>"}
  ${items.length?`<p><b>Total: ${money(total)}</b></p><button class="wa" onclick="order()">Order on WhatsApp</button>`:""}</div></div>`;
}
function adminView(){
  if(!user)return `<div class="box"><h2>Admin Login</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><p id="err" class="err"></p><button onclick="login()">Login</button></div>`;
  const e=products.find(p=>p.id===editId)||{};
  const cur=pendingImg??e.imageUrl??"";
  return `<div class="box"><h2>${editId?"Edit":"Add"} Product</h2>
  <input id="n" placeholder="Product name" value="${esc(e.name)}">
  <input id="pr" type="number" placeholder="Price (Rs.)" value="${e.price??""}">
  <textarea id="ds" maxlength="500" placeholder="Product description (size, color, material...)" style="min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;width:100%;background:#00000040;color:#fff;font-family:inherit">${esc(e.description)}</textarea>
  <select id="ct">${CATS.map(c=>`<option ${c===e.category?"selected":""}>${c}</option>`).join("")}</select>
  <label class="upl">📷 Choose photo (gallery / camera)<input type="file" accept="image/*" onchange="pick(this)" hidden></label>
  <img id="pv" class="pvs" alt="" ${cur?`src="${esc(cur)}"`:'style="display:none"'}>
  <small id="ust"></small>
  <input id="im" placeholder="Photo URL (auto-filled after upload)" value="${esc(cur)}">
  <label><input type="checkbox" id="st" ${e.inStock===false?"":"checked"}> In stock</label>
  <button onclick="save()">Save</button>${editId?`<button class="gray" onclick="edit(null)">Cancel</button>`:""}</div>
  <div class="box"><h3>Products (${products.length}) <button class="gray" onclick="logout()">Logout</button></h3>
  ${products.map(p=>`<div class="row"><span>${esc(p.name)}<br><small>${money(p.price)} · ${esc(p.category)}${p.inStock===false?" · out of stock":""}</small></span><span><button onclick="edit('${p.id}')">✏️</button> <button class="gray" onclick="del('${p.id}')">🗑️</button></span></div>`).join("")}</div>`;
}
Object.assign(window,{
  setCat:c=>{cat=c;anim=true;render()},
  toggleMenu:f=>document.body.classList.toggle("menu",f),
  goCat:c=>{cat=c;anim=true;document.body.classList.remove("menu");if(location.hash==="#admin")location.hash="";else render();scrollTo({top:0,behavior:"smooth"})},
  goAbout:()=>{document.body.classList.remove("menu");if(location.hash==="#admin")location.hash="";setTimeout(()=>{const a=document.querySelector(".about");if(a)a.scrollIntoView({behavior:"smooth"})},150)},
  toggleCart:()=>{showCart=!showCart;render()},
  add:id=>{cart[id]=(cart[id]||0)+1;render()},
  qty:(id,d)=>{cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()},
  order:()=>{
    const items=cartItems(),total=items.reduce((a,x)=>a+x.p.price*x.q,0);
    const base=location.origin+location.pathname,msg="Hello NAAZ MULTI, I want to order:\n\n"+items.map((x,i)=>`${i+1}) ${x.p.name} (${x.p.category})\n${x.q} x ${money(x.p.price)} = ${money(x.p.price*x.q)}\nPhoto & details: ${base}#p=${x.p.id}`).join("\n\n")+"\n\nTotal: "+money(total);
    open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  },
  login:async()=>{
    try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}
    catch(e){$("#err").textContent="Login failed: check email/password"}
  },
  logout:()=>signOut(auth),
  edit:id=>{editId=id;pendingImg=null;render();scrollTo(0,0)},
  pick:async inp=>{
    const f=inp.files[0];if(!f)return;const st=$("#ust");st.textContent="Processing photo...";
    try{
      let url;
      if(CLOUD&&PRESET){
        const b=await shrink(f,1000,.82),fd=new FormData();fd.append("file",b);fd.append("upload_preset",PRESET);
        const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:"POST",body:fd}),j=await r.json();
        if(!j.secure_url)throw new Error((j.error&&j.error.message)||"Upload failed");url=j.secure_url;
      }else{
        const b=await shrink(f,480,.7);
        url=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
        if(url.length>700000)throw new Error("Photo too big, try another");
      }
      pendingImg=url;$("#im").value=url;const pv=$("#pv");pv.src=url;pv.style.display="block";st.textContent="✅ Photo ready, now press Save";
    }catch(e){st.textContent="❌ "+e.message}
  },
  save:async()=>{
    const price=parseInt($("#pr").value,10),name=$("#n").value.trim();
    if(!name||isNaN(price))return alert("Name and price (number) required");
    const data={name,price,description:$("#ds").value.trim(),category:$("#ct").value,imageUrl:$("#im").value.trim(),inStock:$("#st").checked};
    try{
      if(editId)await updateDoc(doc(db,"products",editId),data);
      else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
      editId=null;pendingImg=null;render();
    }catch(e){alert("Save failed: "+e.message)}
  },
  del:async id=>{if(confirm("Delete this product?")){try{await deleteDoc(doc(db,"products",id))}catch(e){alert(e.message)}}}
});
</script>
<style>
body{background-size:200% 200%;animation:bgmove 16s ease-in-out infinite}
@keyframes bgmove{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
h1{background:linear-gradient(90deg,#38bdf8,#e0f2fe,#93c5fd,#38bdf8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
h1::before{filter:drop-shadow(0 0 6px #38bdf8);animation:logoglow 2.5s ease-in-out infinite}
@keyframes logoglow{50%{filter:drop-shadow(0 0 15px #7dd3fc)}}
.chip.on{animation:chipglow 2s ease-in-out infinite}
@keyframes chipglow{50%{box-shadow:0 0 14px #38bdf8aa}}
#splash{position:fixed;inset:0;z-index:50;background:#03102b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#splash img{width:110px;animation:logoin 1.2s cubic-bezier(.2,1.4,.4,1) both}
#splash b{letter-spacing:6px;color:#7dd3fc;animation:fade .8s .5s both}
@keyframes logoin{from{transform:scale(.2) rotate(-180deg);opacity:0}}
.bub{position:fixed;bottom:-60px;border-radius:50%;background:radial-gradient(circle,#7dd3fc55,#2563eb11);z-index:0;pointer-events:none;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh)}}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#e0f2fe;z-index:0;pointer-events:none;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.5)}}
.tick{position:relative;z-index:1;overflow:hidden;white-space:nowrap;background:#ffffff10;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px;color:#bae6fd}
.tick span{display:inline-block;padding-left:100%;animation:mq 18s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.card::before{content:"";position:absolute;inset:0;border-radius:16px;padding:1.5px;background:conic-gradient(from var(--a),transparent 60%,#38bdf8,#e0f2fe,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinb 4s linear infinite;pointer-events:none;z-index:2}
@keyframes spinb{to{--a:360deg}}
button{position:relative;overflow:hidden}

sp.innerHTML='<img src="logo.png" alt=""><b>NAAZ MULTI</b>';document.body.appendChild(sp);

// ticker
var t=document.createElement("div");t.className="tick";
t.innerHTML="<span>✨ NAAZ MULTI · New Collection · WhatsApp-la easy-ah order pannunga ✨</span>";
$("header").after(t);
// ripple
document.addEventListener("pointerdown",function(e){
  var b=e.target.closest("button");if(!b)return;

  b.appendChild(x);setTimeout(function(){x.remove()},600)});

  var b=e.target.closest(".card button");if(!b)return;

  var a=src.getBoundingClientRect(),c=cart.getBoundingClientRect(),f=src.cloneNode(true);
  f.style.cssText="position:fixed;z-index:60;pointer-events:none;margin:0;border-radius:12px;left:"+a.left+"px;top:"+a.top+"px;width:"+a.width+"px;height:"+a.height+"px;animation:none";
  document.body.appendChild(f);
  f.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+(c.left+c.width/2-a.left-a.width/2)+"px,"+(c.top+c.height/2-a.top-a.height/2)+"px) scale(.1)",opacity:.4}],{duration:700,easing:"cubic-bezier(.5,0,.8,.4)"}).onfinish=function(){f.remove();cart.animate([{transform:"scale(1)"},{transform:"scale(1.4)"},{transform:"scale(1)"}],{duration:350})};
},true);
// sparkle trail
var last=0;
document.addEventListener("pointermove",function(e){

  s.style.cssText="position:fixed;z-index:70;pointer-events:none;width:7px;height:7px;border-radius:50%;background:radial-gradient(#fff,#38bdf8);left:"+(e.clientX-3)+"px;top:"+(e.clientY-3)+"px";
  document.body.appendChild(s);
  s.animate([{transform:"scale(1)",opacity:.9},{transform:"translateY(-18px) scale(0)",opacity:0}],{duration:650}).onfinish=function(){s.remove()}});
// confetti
document.addEventListener("click",function(e){
  var b=e.target.closest(".wa");if(!b)return;
  var r=b.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top,cols=["#38bdf8","#93c5fd","#e0f2fe","#fde68a","#25d366"];
  for(var k=0;k<40;k++){

    document.body.appendChild(p);

    p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) rotate("+Math.random()*540+"deg)",opacity:1,offset:.45},{transform:"translate("+dx*1.2+"px,"+(dy+420)+"px) rotate("+Math.random()*900+"deg)",opacity:0}],{duration:1300,easing:"ease-out"}).onfinish=(function(q){return function(){q.remove()}})(p)}
},true);
// about section
var ADDRESS="Mega Sale, 45 Vystwyke Rd, Mattakkuliya, Colombo 00015, Sri Lanka";
var WA="94767605858",IG="naaz_multi_collection",q=encodeURIComponent(ADDRESS);
var ab=document.createElement("section");ab.className="about";
ab.innerHTML='<div class="box"><h3>About NAAZ MULTI COLLECTION</h3>'

$("main").after(ab);

<style>
.fb{position:relative;z-index:0;max-width:900px;margin:0 auto;padding:0 12px 12px}
.fb .box{gap:10px}
.stars{display:flex;gap:6px;font-size:32px}

.fbok{color:#86efac}.fberr{color:#ff7b7b}

<script type="module">
import {getApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,where,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=getApp(),db=getFirestore(app),auth=getAuth(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const when=d=>d&&d.toDate?d.toDate().toLocaleDateString():"";
const sec=()=>{const s=document.createElement("section");s.className="fb";return s};
const pub=sec(),adm=sec();
pub.innerHTML=`<div class="box"><h3>⭐ Customer Feedback</h3><div id="fbList"></div></div>
<div class="box"><h3>Share your feedback</h3>
<input id="fbn" maxlength="40" placeholder="Your name">
<div class="stars" id="fbs"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
<textarea id="fbt" maxlength="400" placeholder="Write your feedback..."></textarea>
<small id="fbm"></small>
<button id="fbb">Submit feedback</button></div>`;
(document.querySelector(".about")||$("main")).after(pub);pub.after(adm);
let rate=0;
$("#fbs").addEventListener("click",e=>{const v=+e.target.dataset.v;if(!v)return;rate=v;[...$("#fbs").children].forEach((x,i)=>x.classList.toggle("on",i<v))});
$("#fbb").addEventListener("click",async()=>{
  const m=$("#fbm"),b=$("#fbb"),name=$("#fbn").value.trim(),text=$("#fbt").value.trim();
  m.className="";
  if(name.length<2||!rate||text.length<3){m.className="fberr";m.textContent="Please enter name, stars and your feedback";return}
  if(Date.now()-(+localStorage.getItem("fbLast")||0)<60000){m.className="fberr";m.textContent="Please wait a minute before sending again";return}
  b.disabled=true;
  try{
    await addDoc(collection(db,"feedback"),{name,rating:rate,text,approved:false,createdAt:serverTimestamp()});
    localStorage.setItem("fbLast",Date.now());
    $("#fbn").value="";$("#fbt").value="";rate=0;[...$("#fbs").children].forEach(x=>x.classList.remove("on"));
    m.className="fbok";m.textContent="Thank you! 🙏 Your feedback will show after approval.";
  }catch(e){m.className="fberr";m.textContent="Could not send: "+e.message}
  b.disabled=false;
});
onSnapshot(query(collection(db,"feedback"),where("approved","==",true),limit(40)),s=>{
  const a=s.docs.map(d=>d.data()).sort((x,y)=>((y.createdAt&&y.createdAt.seconds)||0)-((x.createdAt&&x.createdAt.seconds)||0));
  $("#fbList").innerHTML=a.length?a.map(f=>`<div class="fbc"><span class="st">${stars(f.rating)}</span><b>${esc(f.name)}</b><p>${esc(f.text)}</p><small>${when(f.createdAt)}</small></div>`).join(""):'<p style="margin:0;opacity:.7">No feedback yet. Be the first!</p>';
},()=>{});
// admin moderation
let off=null;
onAuthStateChanged(auth,u=>{
  if(off){off();off=null}
  if(u)off=onSnapshot(collection(db,"feedback"),s=>{
    const a=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.approved-y.approved)||(((y.createdAt&&y.createdAt.seconds)||0)-((x.createdAt&&x.createdAt.seconds)||0)));
    const n=a.filter(f=>!f.approved).length;
    adm.innerHTML=`<div class="box"><h3>💬 Feedback (${n} pending)</h3>${a.map(f=>`<div class="fbc"><span class="st">${stars(f.rating)}</span> ${f.approved?"✅":"🕐 pending"}<b>${esc(f.name)}</b><p>${esc(f.text)}</p><div style="display:flex;gap:8px;margin-top:6px">${f.approved?"":`<button data-id="${f.id}" data-act="ok">Approve</button>`}<button class="gray" data-id="${f.id}" data-act="del">Delete</button></div></div>`).join("")||"<p>No feedback yet</p>"}</div>`;
  },()=>{});
  vis();
});
adm.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  const r=doc(db,"feedback",b.dataset.id);
  try{if(b.dataset.act==="ok")await updateDoc(r,{approved:true});else if(confirm("Delete this feedback?"))await deleteDoc(r)}catch(x){alert(x.message)}
});
function vis(){const a=location.hash==="#admin";pub.style.display=a?"none":"block";adm.style.display=a&&auth.currentUser?"block":"none"}
addEventListener("hashchange",vis);vis();
</script>
<style>

<script>
(function(){

bn.innerHTML='<div class="on" data-n="home"><i>🏠</i>Home</div><div data-n="cat"><i>🗂️</i>Categories</div><div data-n="cart"><i>🛒</i>Cart<span class="bdg" id="bdg">0</span></div><div data-n="about"><i>💬</i>Contact</div>';

      const sp=c.querySelector("span");if(sp)sp.insertAdjacentHTML("afterend",'<s class="op">'+money(p.oldPrice)+"</s>");
      c.dataset.o=p.oldPrice;
    }
  });
  const t=$("#app .ptitle"),n=document.querySelectorAll("#app .card.isfav").length,nf=$("#nofav");
  if(favMode&&t){
    t.innerHTML="❤️ My Favourites <small>("+n+")</small>";
    if(!n&&!nf){const g=$("#app .grid");if(g)g.insertAdjacentHTML("afterend",'<p id="nofav">No favourites yet. Tap ♡ on a product ❤️</p>')}
  }
  if((!favMode||n)&&nf)nf.remove();
  const fc=$("#drawer .favi small");if(fc)fc.textContent=favs.size;
}
function burst(h){
  const r=h.getBoundingClientRect();
  for(let k=0;k<7;k++){
    const s=document.createElement("i");s.textContent="❤";
    s.style.cssText="position:fixed;z-index:80;pointer-events:none;font-style:normal;color:#ff4d6d;font-size:13px;left:"+(r.left+r.width/2)+"px;top:"+(r.top+r.height/2)+"px";
    document.body.appendChild(s);
    const a=k/7*Math.PI*2;
    s.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*34+"px,"+(Math.sin(a)*34-14)+"px) scale(.4)",opacity:0}],{duration:700}).onfinish=()=>s.remove();
  }
}
function menu(){
  const d=$("#drawer");if(!d||d.querySelector(".favi"))return;
  const b=document.createElement("button");b.className="mi favi";b.style.setProperty("--k",7);
  b.innerHTML="❤️ My Favourites <small>"+favs.size+"</small>";
  const a=[...d.querySelectorAll(".dl")].find(x=>x.textContent.trim()==="Shop");
  if(a)d.insertBefore(b,a);else d.appendChild(b);
}
document.addEventListener("click",e=>{

  if(e.target.closest(".hm-cat,.bn div[data-n=home],button.mi[onclick^=goCat]")){favMode=false;document.body.classList.remove("favmode")}

// ---------- admin: old price field + save ----------
function adminForm(){
  const pr=$("#app #pr");
  if(pr&&!$("#op")){
    const i=document.createElement("input");i.id="op";i.type="number";i.placeholder="Old price (optional) - shows discount tag";
    i.value=(curEdit&&P[curEdit]&&P[curEdit].oldPrice)||"";pr.after(i);
  }
}
async function mySave(){
  const price=parseInt($("#pr").value,10),name=$("#n").value.trim(),op=parseInt(($("#op")||{}).value,10);
  if(!name||isNaN(price))return alert("Name and price (number) required");
  const data={name,price,description:($("#ds")||{value:""}).value.trim(),category:$("#ct").value,imageUrl:$("#im").value.trim(),inStock:$("#st").checked,oldPrice:op>price?op:null};
  try{
    if(curEdit)await updateDoc(doc(db,"products",curEdit),data);
    else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});
    curEdit=null;window.edit(null);
  }catch(e){alert("Save failed: "+e.message)}
}
A.addEventListener("click",e=>{
  const h=e.target.closest(".fv");
  if(h){
    e.stopPropagation();
    const id=h.closest(".card").dataset.id;
    if(favs.has(id))favs.delete(id);else{favs.add(id);burst(h)}
    saveFav();h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop");decorate();return;
  }
  const eb=e.target.closest("button[onclick^='edit(']");
  if(eb){const m=eb.getAttribute("onclick").match(/edit\('([^']+)'\)/);curEdit=m?m[1]:null}
  if(e.target.closest("button[onclick='save()']")){e.stopImmediatePropagation();mySave();return}
  lastCard=e.target.closest(".card");
  setTimeout(()=>{
    const pv=$(".pv .pvp");
    if(pv&&lastCard&&lastCard.dataset.o&&!pv.querySelector(".pvo"))pv.insertAdjacentHTML("beforeend",'<s class="pvo">'+money(lastCard.dataset.o)+"</s>");
  },0);
},true);
new MutationObserver(()=>{decorate();adminForm()}).observe(A,{childList:true});
const dr=$("#drawer");if(dr)new MutationObserver(menu).observe(dr,{childList:true});
decorate();adminForm();menu();
